    - match: example-console-ui
      securityImpactProfile: service-content.bounded-processing.deferrable-work
    - match: example-portal-cdn
      securityImpactProfile: public-content.opaque-forwarding.bounded-service
    - match: example-assets-cdn
      securityImpactProfile: public-content.opaque-forwarding.bounded-service
    - match: example-portal-ui-*
      securityImpactProfile: service-content.bounded-processing.deferrable-work
    - match: example-assets-ui-*
