# Extended Docker Swarm configuration example for a fictional SaaS platform.
# All image names are illustrative placeholders; replace them for your environment.
# Profile assignments illustrate policy decision traces, not an assessed system.
# Review each profile and reachability declaration before production use.
#
# Create on a manager: docker config create vdr-fedramp-example vdr-fedramp.extended.yaml
# Scan: trivy vdr swarm --region us-gov-west-1 --context-name swarm/example \
#         --swarm-config-name vdr-fedramp-example
# The config is read directly from the manager and need not be mounted in a service.

class: "C"            # Illustrative FedRAMP Certification Class
multiAgency: "true"   # Illustrative multi-agency deployment
# securityRequirementsCeiling: cr-h_ir-h_ar-h

scoring.yaml: |
  # Match image repository basenames, ignoring registry, tag and digest.
  # First match wins; keep specific names above overlapping globs.
  imageRules:
    - match: example-administration-api
      securityImpactProfile: privileged-access.identity-control.shared-critical-path
    - match: example-authentication-api
      securityImpactProfile: root-secrets.identity-control.shared-degradation
    - match: example-authentication-worker
      securityImpactProfile: root-secrets.identity-control.shared-degradation
    - match: example-identity-api
      securityImpactProfile: root-secrets.identity-control.shared-degradation
    - match: example-provisioning-api
      securityImpactProfile: privileged-access.identity-control.bounded-service
    - match: example-authorization-api
      securityImpactProfile: privileged-access.identity-control.shared-degradation
    - match: example-credential-reader
      securityImpactProfile: privileged-access.identity-control.deferrable-work
    - match: example-tenant-boundary-api
      securityImpactProfile: privileged-access.security-enforcement.shared-critical-path
    - match: example-tenant-management-api
      securityImpactProfile: control-metadata.config-control.operations-support
    - match: example-audit-records-api
      securityImpactProfile: restricted-evidence.authoritative-record.operations-support
    - match: example-resource-admin-api
      securityImpactProfile: privileged-access.config-control.bounded-service
    - match: example-portal-api
      securityImpactProfile: privileged-access.identity-control.shared-degradation
    - match: example-public-gateway
      securityImpactProfile: service-content.security-enforcement.shared-critical-path
    - match: example-integration-gateway
      securityImpactProfile: service-content.security-enforcement.shared-critical-path
    - match: example-endpoint-gateway
      securityImpactProfile: service-content.security-enforcement.bounded-service
    - match: example-desktop-gateway
      securityImpactProfile: service-content.security-enforcement.bounded-service
    - match: example-mobile-gateway
      securityImpactProfile: service-content.security-enforcement.bounded-service
    - match: example-console-gateway
      securityImpactProfile: service-content.scoped-write.bounded-service
    - match: example-entitlement-api
      securityImpactProfile: control-metadata.authoritative-record.bounded-service
    - match: example-entitlement-gateway
      securityImpactProfile: control-metadata.security-enforcement.bounded-service
    - match: example-records-api
      securityImpactProfile: federal-records.scoped-write.bounded-service
    - match: example-records-processor
