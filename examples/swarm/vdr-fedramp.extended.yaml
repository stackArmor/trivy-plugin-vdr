    - match: example-submission-api
      securityImpactProfile: federal-records.authoritative-record.mission-essential
    - match: example-submission-queue
      securityImpactProfile: federal-records.authoritative-record.mission-essential
    - match: example-resource-catalog-api
      securityImpactProfile: ops-metadata.authoritative-record.bounded-service
    - match: example-deferred-task-api
      securityImpactProfile: service-content.scoped-write.bounded-service
    - match: example-remote-submission-api
      securityImpactProfile: federal-records.authoritative-record.mission-essential
    - match: example-task-holding-api
      securityImpactProfile: federal-records.authoritative-record.mission-essential
    - match: example-protocol-gateway
      securityImpactProfile: federal-records.authoritative-record.mission-essential
    - match: example-remote-gateway
      securityImpactProfile: federal-records.authoritative-record.mission-essential
    - match: example-resource-gateway
      securityImpactProfile: federal-records.authoritative-record.mission-essential
    - match: example-registration-api
      securityImpactProfile: ops-metadata.authoritative-record.bounded-service
    - match: example-statistics-api
