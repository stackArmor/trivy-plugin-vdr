    - match: example-quota-api
      securityImpactProfile: routing-metadata.scoped-write.bounded-service
    - match: example-settings-store
      securityImpactProfile: routing-metadata.scoped-write.deferrable-work
    - match: example-integration-worker
      securityImpactProfile: service-content.bounded-processing.bounded-service
    - match: example-message-dispatcher
      securityImpactProfile: service-content.bounded-processing.bounded-service
    - match: example-notification-worker
      securityImpactProfile: opaque-transit.bounded-processing.deferrable-work
    - match: example-email-worker
      securityImpactProfile: service-content.bounded-processing.deferrable-work
    - match: example-status-worker
      securityImpactProfile: routing-metadata.record-keeping.deferrable-work
    - match: example-scheduled-tasks
      securityImpactProfile: opaque-transit.disposable-state.deferrable-work
    - match: example-feature-flags
      securityImpactProfile: routing-metadata.coordination-state.bounded-service
    - match: example-conversion-utility
      securityImpactProfile: opaque-transit.disposable-state.deferrable-work
    - match: example-health-endpoint
      securityImpactProfile: public-content.advisory-output.deferrable-work
    - match: example-build-orchestrator
      securityImpactProfile: control-metadata.coordination-state.change-deferred
    - match: example-infrastructure-controller
      securityImpactProfile: control-metadata.foundation-control.operations-support
    - match: example-edge-proxy
      securityImpactProfile: service-content.security-enforcement.shared-critical-path
    - match: example-manager-proxy
      securityImpactProfile: service-content.security-enforcement.operations-support

# Reachability declarations are illustrative and must match deployment evidence.
# Service labels take precedence over these rules. A false declaration needs a
# justification. Unmatched services with published ports or proxy routes are
# reported as unassessed.
exposure.yaml: |
  proxyLabelPrefixes:
    - traefik.http.routers.
  rules:
    - image: example-edge-proxy
      internetReachable: true
    # Add each service verified as routed from the public edge, for example:
    # - image: example-public-gateway
    #   internetReachable: true
    - image: example-telemetry-collector
      internetReachable: false
      justification: "Illustrative private telemetry service with no published ports or proxy route; verify against deployment evidence."
