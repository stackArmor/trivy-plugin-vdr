---
# Example trivy-plugin-vdr scoring ConfigMap for an EKS cluster.
#
# The plugin reads fedramp-vdr-trivy/vdr-fedramp from the cluster automatically
# (no --scoring-config flag needed). It deep-merges the embedded scoring.yaml over its
# built-in rubric. The built-in rubric already provides the governed compositional
# raw CR/IR/AR security-requirements parser,
# the algorithm, the EPSS LEV threshold (0.50), and the H/H/H cluster-default
# security-requirements vector for new/unclassified resources — so this file only
# carries cluster-wide Class/scope and the rules for EKS-managed,
# shared-responsibility components that cannot carry vdr.fedramp.io/* labels.
#
# If this ConfigMap is missing, the plugin warns and falls back to its built-in
# defaults (Class B, single-agency, no tenant rules).
#
# Apply with:  kubectl apply -f vdr-fedramp-configmap.eks.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: fedramp-vdr-trivy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vdr-fedramp
  namespace: fedramp-vdr-trivy
data:
  # --- cluster-wide scalars (override anything the embedded doc sets) ---
  class: "B"            # set to your FedRAMP Certification Class: A, B, C, or D
  multiAgency: "false"  # "true" if this cluster serves more than one agency

  # --- operator-declared internet-reachable classes (optional) ---
  # List Ingress/Gateway class names whose edge load balancer is provisioned
  # outside Kubernetes (e.g. ingress-nginx or a custom Gateway fronted by an LB
  # built via Terraform), so reachability cannot be inferred from cluster state.
  # Any Ingress/Gateway using a listed class is treated as internet-reachable.
  # This is a cleaner alternative to labeling each resource with
  # vdr.fedramp.io/internet-reachable (which a Helm chart may apply to undesired
  # resources). A per-class label still wins over this list.
  # internetAccessibleIngressClasses: |
  #   - nginx
  # internetAccessibleGatewayClasses: |
  #   - istio

  scoring.yaml: |
    # First match wins. nameRules win over namespaceRules. namespace is an optional
    # glob on the workload namespace; match is a glob on the workload name.
    nameRules:
      # EKS Pod Identity / IRSA credential broker: privileged because it can
      # mint or forward workload credentials, not because the account is a secret.
      - {namespace: kube-system, match: "eks-pod-identity-agent*", securityRequirements: cr-h_ir-h_ar-m}
      # VPC CNI dataplane and kube-proxy.
      - {namespace: kube-system, match: "aws-node*", securityRequirements: cr-m_ir-m_ar-h}
      - {namespace: kube-system, match: kube-proxy, securityRequirements: cr-m_ir-m_ar-h}
      # Storage CSI drivers (EBS/EFS/FSx).
      - {namespace: kube-system, match: "ebs-csi-*", securityRequirements: cr-m_ir-m_ar-h}
      - {namespace: kube-system, match: "efs-csi-*", securityRequirements: cr-m_ir-m_ar-h}
      - {namespace: kube-system, match: "fsx-csi-*", securityRequirements: cr-m_ir-m_ar-h}
      # Node provisioning / autoscaling actuators.
      - {namespace: kube-system, match: "cluster-autoscaler*", securityRequirements: cr-m_ir-m_ar-h}
      - {namespace: kube-system, match: "karpenter*", securityRequirements: cr-m_ir-m_ar-h}
      # Cluster DNS. platform-foundation is for METADATA-ONLY foundation services
      # (DNS/NTP/discovery/plain L4 LBs): CR:L (recon only), IR:H, AR:H. Anything
      # that terminates TLS or sees payload belongs in public-edge (internet-
      # facing) or app-tier (internal) instead.
      - {namespace: kube-system, match: "coredns*", securityRequirements: cr-l_ir-h_ar-h}
      # Ingress / load-balancer controller. It carries no traffic — it holds AWS
      # credentials that provision and reshape the public ALBs/NLBs, so the
      # control-plane lens applies: config-actuation. (The ALB itself terminates
      # TLS on AWS's side; an in-cluster terminating proxy such as nginx-ingress
      # would be public-edge, and a pure L4/SNI passthrough would be
      # passthrough-edge.)
      - {namespace: kube-system, match: "aws-load-balancer-controller*", securityRequirements: cr-m_ir-h_ar-m}

    namespaceRules:
      # CloudWatch agent / Fluent Bit observability.
      - {match: amazon-cloudwatch, securityRequirements: cr-l_ir-l_ar-l}
      # Other AWS-managed add-on namespaces (guardduty agent, etc.).
      - {match: "aws-*", securityRequirements: cr-l_ir-l_ar-l}
      # Everything else in kube-system (metrics-server, node-local-dns, device
      # plugins, etc.) is low-privilege node/observability infra.
      - {match: kube-system, securityRequirements: cr-l_ir-l_ar-l}
