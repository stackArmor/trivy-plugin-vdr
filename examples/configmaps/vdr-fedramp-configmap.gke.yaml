---
# Example trivy-plugin-vdr scoring ConfigMap for a GKE cluster.
#
# The plugin reads fedramp-vdr-trivy/vdr-fedramp from the cluster automatically
# (no --scoring-config flag needed). It deep-merges the embedded scoring.yaml over its
# built-in rubric. The built-in rubric already provides the governed compositional
# reason registry and optional named-archetype catalog,
# the algorithm, the EPSS LEV threshold (0.50), and the H/H/H "unclassified"
# cluster-default profile for new/unclassified resources — so this file only
# carries cluster-wide Class/scope and the rules for GKE-managed,
# shared-responsibility components that cannot carry vdr.fedramp.io/* labels.
#
# If this ConfigMap is missing, the plugin warns and falls back to its built-in
# defaults (Class B, single-agency, no tenant rules).
#
# Apply with:  kubectl apply -f vdr-fedramp-configmap.gke.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: fedramp-vdr-trivy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vdr-fedramp
  namespace: fedramp-vdr-trivy
data:
  # --- cluster-wide scalars (override anything the embedded doc sets) ---
  class: "B"            # set to your FedRAMP Certification Class: A, B, C, or D
  multiAgency: "false"  # "true" if this cluster serves more than one agency
  # Optional system-and-agency ceiling; omit to leave profile scoring unchanged.
  # securityRequirementsCeiling: cr-m_ir-m_ar-l

  # --- operator-declared internet-reachable classes (optional) ---
  # List Ingress/Gateway class names whose edge load balancer is provisioned
  # outside Kubernetes (e.g. ingress-nginx or a custom Gateway fronted by a
  # standalone-NEG / Terraform L7 LB), so reachability cannot be inferred from
  # cluster state. Any Ingress/Gateway using a listed class is treated as
  # internet-reachable. This is a cleaner alternative to labeling each resource
  # with vdr.fedramp.io/internet-reachable (which a Helm chart may apply to
  # undesired resources). A per-class label still wins over this list.
  # internetAccessibleIngressClasses: |
  #   - nginx
  # internetAccessibleGatewayClasses: |
  #   - istio
  # WAF, L7, OWASP, or DDoS protections alone do not make a public load balancer
  # non-internet-reachable. Only sufficiently strict IP whitelisting qualifies;
  # a WAF may implement that allowlist.
  # Negative declarations override positive lists and built-in class detection.
  # notInternetAccessibleIngressClasses: |
  #   - nginx-restricted
  # notInternetAccessibleGatewayClasses: |
  #   - istio-restricted
  # notInternetAccessibleServices: |
  #   - ingress-nginx/ingress-nginx-controller

  scoring.yaml: |
    # First match wins. nameRules win over namespaceRules. namespace is an optional
    # glob on the workload namespace; match is a glob on the workload name.
    nameRules:
      # GCP workload-identity / metadata credential broker: privileged because
      # it can mint or forward workload credentials, not because the account is a secret.
      - {namespace: kube-system, match: gke-metadata-server, securityImpactProfile: privileged-identity}
      - {namespace: kube-system, match: "metadata-proxy*", securityImpactProfile: privileged-identity}
      # Cluster networking dataplane / API control tunnel.
      - {namespace: kube-system, match: "calico*", securityImpactProfile: orchestrator}
      - {namespace: kube-system, match: kube-proxy, securityImpactProfile: orchestrator}
      - {namespace: kube-system, match: netd, securityImpactProfile: orchestrator}
      - {namespace: kube-system, match: ip-masq-agent, securityImpactProfile: orchestrator}
      - {namespace: kube-system, match: "konnectivity*", securityImpactProfile: orchestrator}
      - {namespace: kube-system, match: "*dra*", securityImpactProfile: orchestrator}
      # Storage CSI driver.
      - {namespace: kube-system, match: "pdcsi*", securityImpactProfile: orchestrator}
      # Cluster DNS. platform-foundation is for METADATA-ONLY foundation services
      # (DNS/NTP/discovery/plain L4 LBs): CR:L (recon only), IR:H, AR:H. Anything
      # that terminates TLS or sees payload belongs in public-edge (internet-
      # facing) or app-tier (internal) instead.
      - {namespace: kube-system, match: "kube-dns*", securityImpactProfile: platform-foundation}
      # Runtime security / image inspection / CIS hardening.
      - {namespace: kube-system, match: container-watcher, securityImpactProfile: security-tooling}
      - {namespace: kube-system, match: image-package-extractor, securityImpactProfile: security-tooling}
      - {namespace: kube-system, match: configure-cis-level-2, securityImpactProfile: security-tooling}
      - {namespace: kube-system, match: runsc-metric-server, securityImpactProfile: security-tooling}
      # Ingress default backend (behind the provider-terminated GCLB, so
      # passthrough; an in-cluster terminating proxy would be public-edge).
      - {namespace: kube-system, match: l7-default-backend, securityImpactProfile: passthrough-edge}

    namespaceRules:
      # Specific gke-managed namespaces first, then the catch-all.
      - {match: gke-managed-networking-dra-driver, securityImpactProfile: orchestrator}
      - {match: gke-managed-volumepopulator, securityImpactProfile: orchestrator}
      - {match: "gke-managed-*", securityImpactProfile: internal-tooling}
      # Managed Prometheus (observability).
      - {match: gmp-system, securityImpactProfile: internal-tooling}
      - {match: gmp-public, securityImpactProfile: internal-tooling}
      # Everything else in kube-system (metrics agents, fluentbit, device plugins,
      # autoscalers, event exporter, etc.) is low-privilege node/observability infra.
      - {match: kube-system, securityImpactProfile: internal-tooling}
